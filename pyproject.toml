[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"

[installer]
no-binary = [ ":none:" ]

[tool.poetry]
name = "toetactic"
version = "0.10.3-pre.0"
description = "Play Tic Tac Toe in the terminal"
license = "Apache-2.0"
authors = [ "Little Godzilla Laboratory <blah+lgl@cliffano.com>" ]
readme = "README.md"
homepage = "https://github.com/littlegodzillalaboratory/toetactic"
repository = "https://github.com/littlegodzillalaboratory/toetactic"
documentation = "https://github.com/littlegodzillalaboratory/toetactic"
keywords = [ "toetactic", "tic-tac-toe", "cli", "game" ]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

  [[tool.poetry.packages]]
  include = "toetactic"

  [tool.poetry.scripts]
  toetactic = "toetactic:cli"

  [tool.poetry.dependencies]
  python = "^3.12"
  click = "~8.5.1"
  conflog = "~2.1.2"
  tictactoe-policy = "~1.0.0"

[tool.poetry.group.dev.dependencies]
black = "~26.10.1"
twine = "~7.0.0"
wheel = "~0.48.0"

[tool.poetry.group.test.dependencies]
bandit = "~1.9.4"
coverage = "~7.17.3"
numpy = "1.26.4"
pylint = "~4.1.4"
pytest = "~9.2.0"
wily = "~1.25.0"

[tool.poetry.group.doc.dependencies]
ansi2html = "~1.9.5"
pylint-report = "~2.4.2"
pytest-html = "~4.2.0"
Sphinx = "8.1.3"
