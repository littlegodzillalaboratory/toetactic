[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"

[installer]
no-binary = [ ":none:" ]

[tool.poetry]
name = "toetactic"
version = "0.9.0-pre.0"
description = "Play Tic Tac Toe in the terminal"
license = "Apache-2.0"
authors = [ "Cliffano Subagio <cliffano@gmail.com>" ]
readme = "README.md"
homepage = "https://github.com/cliffano/toetactic"
repository = "https://github.com/cliffano/toetactic"
documentation = "https://github.com/cliffano/toetactic"
keywords = [ "toetactic", "tic-tac-toe", "cli", "game" ]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[[tool.poetry.packages]]
include = "toetactic"

[tool.poetry.scripts]
toetactic = "toetactic:cli"

[tool.poetry.dependencies]
python = "^3.10"
click = "~8.3.3"
conflog = "~2.1.1"

[tool.poetry.group.dev.dependencies]
black = "~26.5.0"
twine = "~6.2.0"
wheel = "~0.47.0"

[tool.poetry.group.test.dependencies]
coverage = "~7.14.0"
numpy = "1.26.4" # https://stackoverflow.com/questions/78634235/numpy-dtype-size-changed-may-indicate-binary-incompatibility-expected-96-from
pylint = "~4.0.5"
pytest = "~9.0.3"
wily = "~1.25.0"

[tool.poetry.group.doc.dependencies]
ansi2html = "~1.9.2"
pylint-report = "~2.4.2"
pytest-html = "~4.2.0"
Sphinx = "8.1.3" # Pinned for Python 3.10 support
