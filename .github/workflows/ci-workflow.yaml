---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      max-parallel: 1
      matrix:
        # Available Python versions: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        python: [ '3.12', '3.14' ]
    name: python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make deps
      - run: make ci
      - run: make test-examples || echo "Examples test exits with error"
      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.LITTLEGODZILLALABORATORY_GITHUB_TOKEN }}
          publish_dir: stage/gh-pages
